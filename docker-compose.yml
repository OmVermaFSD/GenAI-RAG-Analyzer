version: '3.8'

services:
  rag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-ai-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_MODEL=llama3
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - UPLOAD_DIR=/app/data/uploads
      - SQLITE_DB_URL=sqlite:////app/data/app.db
      - JWT_SECRET_KEY=production-jwt-secret-key-change-me
    volumes:
      - rag-data:/app/data
    depends_on:
      - ollama
    networks:
      - rag-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge

volumes:
  rag-data:
  ollama-models:
